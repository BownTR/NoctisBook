<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okuma Modu | Noctis Kitap Dünyası</title>
    <link rel="stylesheet" href="landing.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <script src="translations.js"></script>
    <style>
        :root {
            --read-bg: #0a0908;
            --paper-bg: #fdfaf3;
            --paper-text: #2c241e;
            --gold: #d4af37;
        }

        body {
            background: var(--read-bg);
            color: #fff;
            overflow-x: hidden;
        }

        .read-container {
            display: grid;
            grid-template-columns: 400px 1fr;
            min-height: 100vh;
        }

        /* Left Side: Book Info & Navigation */
        .read-sidebar {
            padding: 60px 40px;
            background: rgba(0,0,0,0.3);
            border-right: 1px solid rgba(212, 175, 55, 0.1);
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 30px;
            z-index: 10;
        }

        .read-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
        }

        .read-back:hover { transform: translateX(-5px); }

        .read-book-cover {
            width: 100%;
            aspect-ratio: 2/3;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .read-book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .read-book-meta h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .read-book-meta p {
            color: var(--gold);
            font-size: 16px;
            font-family: 'Outfit', sans-serif;
        }

        .chapter-nav {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .chapter-nav-item {
            padding: 12px 15px;
            background: rgba(255,255,255,0.03);
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
            color: rgba(255,255,255,0.6);
        }

        .chapter-nav-item:hover, .chapter-nav-item.active {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--gold);
            color: var(--gold);
        }

        /* Right Side: Content */
        .read-content-area {
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: linear-gradient(to right, #0a0908, #111);
            min-height: 100vh;
        }

        .reader-wrapper {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .paper-view {
            width: 100%;
            min-height: 720px;
            background: #fdfaf2;
            color: var(--paper-text);
            padding: 44px 52px 26px;
            border-radius: 16px;
            border: 2px solid rgba(212, 175, 55, 0.45);
            box-shadow: 0 25px 65px rgba(0, 0, 0, 0.75), 0 0 25px rgba(212, 175, 55, 0.12);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: opacity 0.2s ease;
            box-sizing: border-box;
            cursor: pointer;
        }

        /* Inner vintage book boundary frame */
        .paper-view::after {
            content: "";
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 1px solid rgba(180, 140, 50, 0.28);
            border-radius: 10px;
            pointer-events: none;
            box-sizing: border-box;
        }

        /* Paper Texture Effect */
        .paper-view::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://www.transparenttextures.com/patterns/old-paper.png');
            opacity: 0.12;
            pointer-events: none;
            border-radius: 14px;
        }

        .paper-header {
            display: none !important;
        }

        /* Reader Top Navigation Bar */
        .reader-top-bar {
            width: 100%;
            max-width: 760px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 8px 14px;
            background: rgba(18, 16, 14, 0.88);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 12px;
            backdrop-filter: blur(12px);
            margin-bottom: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
            z-index: 50;
            box-sizing: border-box;
        }

        .reader-top-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.88);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.35);
            font-size: 13.5px;
            font-weight: 600;
            padding: 7px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Outfit', sans-serif;
            text-decoration: none;
            backdrop-filter: blur(8px);
        }

        .reader-top-back-btn:hover {
            color: var(--gold);
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.18);
            transform: translateX(-3px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.22);
        }

        .reader-top-back-btn .back-arrow {
            font-size: 15px;
            transition: transform 0.2s ease;
        }

        .reader-top-back-btn:hover .back-arrow {
            transform: translateX(-2px);
        }

        .chapter-text-content {
            font-family: 'EB Garamond', serif;
            font-size: 16.5px;
            line-height: 1.7;
            text-align: justify;
            color: rgba(38, 30, 22, 0.95);
            flex: 1;
            min-height: 0;
            margin-bottom: 20px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
        }

        .chapter-text-content p {
            margin-bottom: 14px;
            text-indent: 28px;
        }

        .paper-footer {
            text-align: center;
            border-top: 1px solid rgba(44, 36, 30, 0.12);
            padding-top: 12px;
            flex-shrink: 0;
        }

        .paper-page-num {
            font-size: 13px;
            color: rgba(44, 36, 30, 0.5);
            font-style: italic;
            font-family: 'Playfair Display', serif;
            letter-spacing: 2px;
        }

        /* Reader Navigation Bar (Separated pages 1, 2, 3...) */
        .reader-page-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 760px;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: nowrap;
            position: relative;
            z-index: 50;
            touch-action: manipulation;
        }

        .reader-pages-list {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap;
            justify-content: center;
            touch-action: manipulation;
        }

        .page-num-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.25);
            color: rgba(255, 255, 255, 0.8);
            min-width: 36px;
            height: 36px;
            padding: 0 10px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            backdrop-filter: blur(8px);
        }

        .page-num-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            color: #fff;
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
        }

        .page-num-btn.active {
            background: linear-gradient(135deg, #d4af37, #b89328);
            color: #0b0a08;
            border-color: var(--gold);
            font-weight: 700;
            box-shadow: 0 0 16px rgba(212, 175, 55, 0.45);
            transform: scale(1.05);
        }

        .page-num-ellipsis {
            color: rgba(212, 175, 55, 0.5);
            padding: 0 4px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .reader-nav-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 175, 55, 0.25);
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            font-family: 'Outfit', sans-serif;
            backdrop-filter: blur(10px);
        }

        .reader-nav-btn:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        .reader-nav-btn:disabled {
            opacity: 0.25;
            cursor: default;
            pointer-events: none;
        }

        /* Scroll Progress */
        .scroll-progress {
            position: fixed;
            top: 0; left: 0;
            height: 4px;
            background: var(--gold);
            z-index: 100;
            width: 0%;
            transition: 0.1s;
        }

        /* Loading */
        .read-loader {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--read-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: 0.5s;
        }

        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(212, 175, 55, 0.1);
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Modern Sidebar Toggle */
        .sidebar-toggle {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 55px;
            height: 55px;
            background: var(--gold);
            color: #000;
            border-radius: 50%;
            border: none;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-toggle.active {
            transform: rotate(180deg);
            background: #fff;
        }

        @media (max-width: 1024px) {
            .read-container { 
                grid-template-columns: 1fr; 
                display: block;
            }

            .sidebar-toggle { 
                display: flex; 
            }

            .read-sidebar { 
                position: fixed;
                top: 0;
                left: 0;
                width: 320px;
                height: 100vh;
                transform: translateX(-100%);
                transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
                background: #0a0908;
                box-shadow: 20px 0 50px rgba(0,0,0,0.8);
                padding: 40px 30px;
                border: none;
            }

            .read-sidebar.open {
                transform: translateX(0);
            }

            .read-content-area { 
                padding: 15px 12px 25px;
                background: var(--read-bg);
                min-height: 100vh;
            }

            .reader-wrapper {
                width: 100%;
                max-width: 520px;
                gap: 12px;
            }

            .paper-view { 
                width: 100%;
                min-height: calc(100vh - 130px);
                max-height: none;
                padding: 26px 22px 18px; 
                box-shadow: 0 15px 40px rgba(0,0,0,0.5);
                border: 1.5px solid rgba(212, 175, 55, 0.45);
                cursor: pointer;
            }

            .paper-view::after {
                top: 7px;
                left: 7px;
                right: 7px;
                bottom: 7px;
                border-radius: 7px;
            }

            .reader-top-bar {
                padding: 6px 10px;
                margin-bottom: 10px;
            }

            .reader-top-back-btn {
                padding: 6px 12px;
                font-size: 13px;
            }

            .chapter-text-content {
                font-size: 15.5px;
                line-height: 1.68;
                min-height: 0;
                flex: 1;
                margin-bottom: 12px;
            }

            .reader-page-nav {
                gap: 5px;
                margin-top: 10px;
                flex-wrap: nowrap;
                z-index: 100;
            }

            .reader-nav-btn {
                padding: 6px 10px;
                font-size: 14px;
                min-width: 38px;
                height: 38px;
                justify-content: center;
                border-radius: 9px;
                touch-action: manipulation;
                cursor: pointer;
            }

            .reader-nav-btn .nav-text {
                display: none;
            }

            .page-num-btn {
                min-width: 36px;
                height: 38px;
                padding: 0 6px;
                font-size: 13px;
                border-radius: 9px;
                touch-action: manipulation;
                cursor: pointer;
            }

            .read-sidebar-overlay {
                display: none;
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.7);
                z-index: 9;
                backdrop-filter: blur(5px);
            }

            .read-sidebar.open + .read-sidebar-overlay {
                display: block;
            }
        }
    </style>
</head>
<body>
    <button class="sidebar-toggle" id="sidebar-toggle">📑</button>
    <div class="read-sidebar-overlay" id="sidebar-overlay"></div>
    
    <div class="scroll-progress" id="progress-bar"></div>
    <div class="grain-overlay"></div>

    <div id="loader" class="read-loader">
        <div class="loader-spinner"></div>
        <p style="margin-top: 20px; color: var(--gold);" data-i18n="book_from_shelf">Kitap Raftan İniyor...</p>
    </div>

    <div class="read-container">
        <!-- Sidebar -->
        <aside class="read-sidebar" id="read-sidebar">
            <div style="display: flex; gap: 8px; margin-bottom: 20px;">
                <a href="index.html" class="read-back" data-i18n="nav_home" style="flex: 1; text-align: center; justify-content: center;">🏠 Ana Sayfa</a>
                <a href="discover.html" class="read-back" data-i18n="nav_discover" style="flex: 1; text-align: center; justify-content: center;">🌍 Keşfet</a>
                <a href="dashboard.html" class="read-back" data-i18n="btn_back_library" style="flex: 1; text-align: center; justify-content: center;">📚 Kütüphanem</a>
            </div>
            
            <div class="read-book-cover">
                <img id="book-cover" src="" alt="Kitap Kapağı">
            </div>

            <div class="read-book-meta">
                <h1 id="book-title" data-i18n="loading">Yükleniyor...</h1>
                <p id="book-author" data-i18n="author_name">✍ Yazar Adı</p>
                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <span id="book-category" style="background: rgba(212,175,55,0.1); color: var(--gold); padding: 5px 12px; border-radius: 12px; font-size: 11px; font-weight: 600;">Roman</span>
                    <span style="background: rgba(255,255,255,0.05); color: #fff; padding: 5px 12px; border-radius: 12px; font-size: 11px; font-weight: 600;">👁 <span id="book-views">0</span></span>
                </div>
            </div>

            <div class="chapter-nav" id="chapter-nav">
                <!-- Chapters will be loaded here -->
            </div>
        </aside>

        <!-- Content Area -->
        <main class="read-content-area">
            <div class="reader-wrapper">
                <!-- Reader Top Bar: Sadece Geri Dön Butonu -->
                <div class="reader-top-bar">
                    <button class="reader-top-back-btn" id="reader-top-back-btn" title="Geri Dön">
                        <span class="back-arrow">←</span>
                        <span class="back-label">Geri</span>
                    </button>
                </div>

                <article class="paper-view" id="paper-view">
                    <div class="chapter-text-content" id="display-chapter-content">
                        Burası yakında kelimelerle dolacak...
                    </div>

                    <footer class="paper-footer">
                        <span class="paper-page-num" id="paper-page-num">— 1 —</span>
                    </footer>
                </article>

                <!-- Page Navigation Bar with Separated Page Numbers -->
                <div class="reader-page-nav">
                    <button class="reader-nav-btn prev" id="reader-prev-btn">
                        <span class="nav-arrow">❮</span>
                        <span class="nav-text" id="reader-prev-text" data-i18n="btn_prev_page">Önceki</span>
                    </button>
                    <div class="reader-pages-list" id="reader-pages-list">
                        <!-- Dynamic page buttons: 1, 2, 3 ... -->
                    </div>
                    <button class="reader-nav-btn next" id="reader-next-btn">
                        <span class="nav-text" id="reader-next-text" data-i18n="btn_next_page">Sonraki</span>
                        <span class="nav-arrow">❯</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Hidden Calculation Ghost -->
    <div id="reader-ghost" style="position: absolute; left: -9999px; visibility: hidden; pointer-events: none; box-sizing: border-box;"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="read.js"></script>
</body>
</html>
